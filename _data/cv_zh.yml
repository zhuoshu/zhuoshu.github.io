- title: 主要科研成果/项目经历
  type: publications
  contents: 



  - title: "Stable Anchors and Fast Adaptation for Streaming Spatial-Temporal Forecasting on Evolving Networks"
    year: 2026
    maindescription: CCF-A类 投稿中
    description: "针对节点增长、分布漂移与监督延迟并存的流式时空预测问题，提出稳定锚特征与轻量适配结合的持续预测框架 SAFA。 该方法通过稳定统计特征驱动的节点锚表征维持身份表达一致性，并结合基于残差修正的轻量快速适配模块和主体冻结的小参数在线更新策略，实现了对新节点与分布漂移的统一适配。相比相关SOTA（ST-TTC，NIPS 2025）方法，**SAFA 在保持较低更新成本的同时提升了流式与节点扩展场景下的稳定性与可持续性**，为开放环境中的可持续时空预测提供了有效方法。"
  
  - title: "Structured Node Interaction Prompting for Expanding-Variate Spatial-Temporal Forecasting"
    year: 2026
    maindescription: CCF-A类 投稿中
    description: "针对演化时空网络中节点集合变化带来的预测问题，提出结构化先验驱动的扩展节点预测框架 SNIP。 该方法利用周期序列 PCA、拓扑谱嵌入和时滞交互等结构先验，结合跨时间演化建模与图结构传播机制，实现结构化先验的时空依赖建模，提升了新节点冷启动条件下的预测精度与结构一致性。与同期SOTA方法（STEV，KDD 2025）相比, **SNIP取得精度提升的同时，GPU占用/训练时间减少至多92.5%与91.32%**，为可扩展的演化时空网络预测提供了新的建模思路。"
 
  - title: "TLAST: A Time-Lag Aware Spatial-Temporal Transformer for Traffic Flow Forecasting"
    year: 2025.7
    maindescription: IEEE Transactions on Intelligent Transportation Systems, 2025. (TITS, IEEE Transcactions，TOP期刊)
    description: "针对 Transformer 在时空预测中计算复杂度高且无法建模传播时延的问题，提出 Time-Lag Embedding 与 Spatial Proxy Attention (SPA) 机制，以线性复杂度捕获异步节点间的传播依赖。
与发表时期的SOTA模型STAEformer对比，**TLAST取得MAE降低2.8%，GPU占用/训练时间减少79.16%与59.66%**。实现了高精度与高效率兼顾的时空预测。"

  - title: "ST-ReP: Learning Predictive Representations Efficiently for Spatial-Temporal Forecasting"
    year: 2025.4
    maindescription: Proceedings of the AAAI Conference on Artificial Intelligence, 2025. (AAAI, CCF-A类会议)
    description: "针对时空数据的表示学习问题，提出基于“重建-预测”的自监督预训练框架，将当前值重构与未来值预测统一到同一预训练目标中，并引入多尺度时间约束，提出“时间压缩-空间提取-时间解压”线性复杂度编码结构，学习具有语义紧凑性与预测性的时空表示，在轻量下游模型和云边协同推理提供可迁移表示。
与发表时期的 SOTA 自监督方法（GPT-ST）相比，**ST-ReP取得MAE降低至多20.24%，GPU占用/训练时间减少67.22%/28.07%**。为构建通用时空基础模型提供了表征层与训练范式的基础。"

  - title: "国自然基金项目：大模型融通的组织学习与创新生态系统研究(200万)"
    year: 2024-2027
    maindescription: 作为学生骨干（大模型与机器学习方向）
    description: "- 该项目是该领域从0到1的开创性工作，建立了研究新范式。本人负责大模型与机器学习方向，围绕创新生态识别、知识组织与政策生成，参与构建垂直领域智能分析方案（图学习、领域大模型），推动复杂领域从少量结构化变量分析向大规模数据驱动建模迁移。\n-	参与数据处理、图学习社区发现、图聚类、继续预训练、LoRA 微调、RAG 检索增强等完整流程，具备从数据构建、模型微调到应用验证的实践经验。已通过中期验收（优）。
\n-	本人具备将图结构建模+检索增强+生成式分析结合到专业领域任务中的经验。具备垂直领域大模型数据建设、任务定义与落地验证能力。具备在不同领域下的快速学习和实践能力。
"


  - title: "TAGnn: Time Adjoint Graph Neural Network for Traffic Forecasting"
    year: 2023.4
    maindescription: "Database Systems for Advanced Applications: 28th International Conference, 2023, Proceedings, Part I. (DASFAA, CCF-B类会议)"
    description: "针对现有GNN模型普遍忽略时间先验与跨时间空间关联的问题，提出跨时间编码模块，并构建时间伴随图卷积结构，以紧凑架构捕获多尺度时空语义。
与同期SOTA模型ASTGNN对比，**TAGnn取得MAE降低至多9.27%，训练耗时减少89.84%**。将显式时间先验与跨时间卷积相结合，实现了可解释、轻量且高精度的时空预测框架。"

  - title: "DSTAGCN: Dynamic Spatial-Temporal Adjacent Graph Convolutional Network for Traffic Forecasting"
    year: 2022.3
    maindescription: IEEE Transactions on Big Data, 2022. (TBD, IEEE Transcactions 期刊)
    description: "针对交通预测中空间依赖动态变化与不确定性的难题，提出基于模糊神经网络的动态邻接生成模块，在跨时间片上构建动态图结构，仅用单层GCN即可捕获长时依赖。
与发表时期的SOTA方法STSGCN对比，**DSTAGCN取得MAE降低8.71%，训练速度提高50.47%**。引入不确定性感知的动态图邻接学习，实现时空依赖的自适应建模与高效预测。"


